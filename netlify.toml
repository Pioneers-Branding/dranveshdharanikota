# NO LONGER IN USE. Kept only so nothing is lost if the site ever goes back to
# plain HTML.
#
# The site is PHP now, and Netlify does not run PHP: it serves static files
# only. Deploying this folder there would hand visitors the raw source of every
# page. The site needs a host that runs PHP, which every ordinary shared host
# does, Hostinger included. Server rules live in .htaccess.
#
# The headers below are what Netlify would have applied.
[build]
  publish = "."

[build.processing]
  skip_processing = true

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "SAMEORIGIN"
    Permissions-Policy = "geolocation=(), microphone=(), camera=()"

[[headers]]
  for = "/css/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/js/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/photos/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
